{{ define "navbar" }}
<div class="fixed top-0 z-50 bg-white p-4 w-full">
    <div class="container mx-auto flex justify-between items-center">
        <div class="text-slate-700 text-lg font-medium">
            <a href="/" class="text-2xl">Scheduler</a>
        </div>
        <ul class="flex space-x-4 text-slate-700 font-semibold font-sans text-sm leading-6">
            <li class="relative">
                <button id="userMenuButton"
                    class="flex items-center space-x-2 text-slate-700 font-semibold font-sans text-sm leading-6 hover:text-sky-500 focus:outline-none">
                    <span>{{.User.Name}}</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div id="userMenu" class="absolute right-0 mt-2 w-48 bg-white border rounded shadow-lg hidden">
                    <a href="/logout" class="block px-4 py-2 text-slate-700 hover:bg-gray-100">Logout</a>
                </div>
            </li>
        </ul>
    </div>
</div>
<script>
    document.getElementById('userMenuButton').addEventListener('click', function () {
        document.getElementById('userMenu').classList.toggle('hidden');
    });
</script>
{{ end }}
