<div>
    <h3>My Schedules</h3>
    <ul>
        {{range .Schedules}}
        <li>
            <a href="/schedules/{{.ID}}">{{.Name}}</a>
        </li>
        {{else}}
        <li>No schedules found</li>
        {{end}}
    </ul>
    <button hx-get="/schedules/new" hx-target="#content-container">New Schedule</button>
</div>
