<div class="flex flex-col mt-4 w-10/12 min-w-96 max-w-5xl bg-white rounded-md">
    <h3 class="font-semibold text-slate-700 text-3xl p-4">Create Schedule</h3>
    <form class="p-4 mt-4 flex flex-col" hx-post="/schedules" hx-trigger="submit" hx-target="closest div">
        <div class="flex flex-row items-baseline">
            <label class="text-gray-700 text-sm font-bold mb-2 px-4" for="name">Name</label>
            <input
                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="text" name="name" placeholder="Schedule Name" />
        </div>
        <div class="flex flex-row items-baseline mt-4">
            <label class="text-gray-700 text-sm font-bold mb-2 px-4" for="startDate">Start Date</label>
            <input
                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="date" name="startDate" placeholder="Start Date" />
            <label class="text-gray-700 text-sm font-bold mb-2 px-4" for="endDate">End Date</label>
            <input
                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="date" name="endDate" placeholder="End Date" />


        </div>
        <div class="grid grid-cols-1 gap-2 mt-12">
            <div class="grid grid-cols-4 items-center gap-2 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="sundayStartTime">Sunday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="sundayStartTime" placeholder="Sunday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="sundayEndTime" placeholder="Sunday End Time" />
            </div>
            <div class="grid grid-cols-4 items-center gap-4 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="mondayStartTime">Monday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="mondayStartTime" placeholder="Monday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="mondayEndTime" placeholder="Monday End Time" />
            </div>
            <div class="grid grid-cols-4 items-center gap-4 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="tuesdayStartTime">Tuesday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="tuesdayStartTime"
                    placeholder="Tuesday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="tuesdayEndTime" placeholder="Tuesday End Time" />
            </div>
            <div class="grid grid-cols-4 items-center gap-4 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="wednesdayStartTime">Wednesday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="wednesdayStartTime"
                    placeholder="Wednesday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="wednesdayEndTime"
                    placeholder="Wednesday End Time" />
            </div>
            <div class="grid grid-cols-4 items-center gap-4 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="thursdayStartTime">Thursday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="thursdayStartTime"
                    placeholder="Thursday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="thursdayEndTime" placeholder="Thursday End Time" />
            </div>
            <div class="grid grid-cols-4 items-center gap-4 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="fridayStartTime">Friday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="fridayStartTime" placeholder="Friday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="fridayEndTime" placeholder="Friday End Time" />
            </div>
            <div class="grid grid-cols-4 items-center gap-4 py-2">
                <label class="text-gray-700 text-sm font-bold px-4 col-span-1" for="saturdayStartTime">Saturday
                    Availability</label>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="saturdayStartTime"
                    placeholder="Saturday Start Time" />
                <p class="col-span-1 text-center">to</p>
                <input
                    class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline col-span-1"
                    type="time" step="900" list="time-options" name="saturdayEndTime" placeholder="Saturday End Time" />
            </div>
        </div>
        <div class="py-4 mt-8 flex items-center">
            <label class="text-gray-700 text-sm font-bold px-4" for="limitToOneBookingPerUser">Limit to One Booking
                Per User</label>
            <input type="checkbox" name="limitToOneBookingPerUser" placeholder=" Booking Per User Limit" />
        </div>
        <button class="m-4 mt-8 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 transition duration-300"
            type="submit">Create</button>
    </form>
</div>
<datalist id="time-options">
</datalist>

<script>
    const timeOptions = document.getElementById("time-options");

    for (let hour = 7; hour <= 23; hour++) {
        for (let minute = 0; minute < 60; minute += 15) {
            const option = document.createElement("option");
            const time = `${hour.toString().padStart(2, "0")}:${minute.toString().padStart(2, "0")}`;
            option.value = time;
            option.text = time;
            timeOptions.appendChild(option);
        }
    }
</script>
