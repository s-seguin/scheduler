<div class="flex flex-col mt-4 w-10/12 min-w-96 max-w-5xl bg-white rounded-md">
    <h3 class="font-semibold text-slate-700 text-3xl p-4">Book Timeslot</h3>
    <form class="p-4 mt-4 flex flex-col" hx-post="/schedules/{{.Schedule.ID}}/timeslots/{{.TimeSlot.ID}}/book">
        <div class="flex flex-row items-baseline">
            <label class="text-gray-700 text-sm font-bold mb-2 px-4" for="name">Name</label>
            <input
                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="text" name="name" placeholder="Your name" />
        </div>
        <div class="flex flex-row items-baseline mt-4">
            <label class="text-gray-700 text-sm font-bold mb-2 px-4" for="name">Email</label>
            <input
                class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                type="email" name="email" placeholder="Your email" />
        </div>
        <div>
            <button type="cancel" hx-get="" hx-target="#content-container">Back</button>
            <button class="m-4 mt-8 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 transition duration-300"
                type="submit">Book</button>
        </div>
    </form>
</div>
